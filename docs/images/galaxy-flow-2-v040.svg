<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Galaxy Control v0.4.0 최초 설정 흐름</title>
  <desc id="desc">공개판 v0.4.0을 진단한 뒤 필요한 도구만 설치하고 사용자가 Galaxy 보안을 승인하며 실제 USB 연결을 확인해 등록하고 필요한 경우에만 브리지와 무선 ADB를 설정한 뒤 실기기 검증하는 순서</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #293044; }
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #536078; }
      .title { font-size: 48px; font-weight: 760; letter-spacing: -2px; }
      .subtitle { font-size: 17px; font-weight: 550; fill: #536078; }
      .section { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #6a7488; }
      .card-title { font-size: 19px; font-weight: 760; }
      .body { font-size: 14px; font-weight: 540; fill: #4f5a70; }
      .small { font-size: 12.5px; font-weight: 550; fill: #617087; }
      .step { font-size: 13px; font-weight: 780; }
      .white { fill: #fff !important; }
      .orange { fill: #e9582c; }
      .blue { fill: #2859bd; }
      .green { fill: #197052; }
      .line { fill: none; stroke: #364157; stroke-width: 2; }
      .orange-line { fill: none; stroke: #e9582c; stroke-width: 2; }
      .green-line { fill: none; stroke: #197052; stroke-width: 2; }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#364157"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e9582c"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#197052"/></marker>
  </defs>
  <rect width="1400" height="980" fill="#fbfcfe"/>
  <rect x="1" y="1" width="1398" height="978" fill="none" stroke="#c7cfdb"/>
  <text x="42" y="46" class="eyebrow">02 / FIRST-TIME SETUP · v0.4.0</text>
  <text x="42" y="98" class="title">처음 연결하는 설정 흐름</text>
  <text x="890" y="52" class="subtitle">진단 → 필요한 도구 → 사용자 보안 승인 → USB 등록</text>
  <text x="890" y="80" class="subtitle">→ 필요한 연결만 구성 → 실기기 검증 순서입니다.</text>

  <rect x="38" y="132" width="1324" height="780" fill="#f5f7fa" stroke="#c7cfdb"/>
  <text x="72" y="168" class="section">REPOSITORY &amp; MAC READINESS</text>

  <rect x="72" y="188" width="270" height="116" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <circle cx="102" cy="218" r="15" fill="#364157"/><text x="102" y="223" class="step white" text-anchor="middle">1</text>
  <text x="128" y="224" class="card-title">공개판 v0.4.0 받기</text>
  <text x="98" y="257" class="body">태그 고정 clone · 설치 스킬 배치</text>
  <text x="98" y="282" class="small">공개 파일에 개인 기기 정보 없음</text>
  <path d="M342 246 H390" class="line" marker-end="url(#arrow)"/>

  <rect x="392" y="188" width="270" height="116" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <circle cx="422" cy="218" r="15" fill="#364157"/><text x="422" y="223" class="step white" text-anchor="middle">2</text>
  <text x="448" y="224" class="card-title">읽기 전용 진단</text>
  <text x="418" y="257" class="body">bootstrap doctor · setup doctor</text>
  <text x="418" y="282" class="small">설치·업데이트 없이 현재 상태 파악</text>
  <path d="M662 246 H710" class="line" marker-end="url(#arrow)"/>

  <rect x="712" y="188" width="276" height="116" rx="8" fill="#f4f7ff" stroke="#2859bd" stroke-width="1.8"/>
  <circle cx="742" cy="218" r="15" fill="#2859bd"/><text x="742" y="223" class="step white" text-anchor="middle">3</text>
  <text x="768" y="224" class="card-title">필요한 도구만 준비</text>
  <text x="738" y="257" class="body">ADB · scrcpy · uv 누락 여부 확인</text>
  <text x="738" y="282" class="small">기존 Homebrew · 사용자 승인 후 설치</text>
  <path d="M988 246 H1036" class="line" marker-end="url(#arrow)"/>

  <rect x="1038" y="188" width="282" height="116" rx="8" fill="#fff8f4" stroke="#e9582c" stroke-width="1.8"/>
  <circle cx="1068" cy="218" r="15" fill="#e9582c"/><text x="1068" y="223" class="step white" text-anchor="middle">4</text>
  <text x="1094" y="224" class="card-title">사용자 보안 준비</text>
  <text x="1064" y="254" class="body">Galaxy 잠금 해제 · USB RSA 승인</text>
  <text x="1064" y="278" class="body">Tailscale 로그인 · VPN/권한 승인</text>
  <text x="1064" y="297" class="small">macOS Computer Use 권한 포함</text>

  <path d="M1179 304 V332 H72 V382" class="orange-line" marker-end="url(#arrow-orange)"/>
  <text x="72" y="358" class="section">USB TRUST ROOT &amp; ENROLLMENT</text>

  <rect x="72" y="384" width="390" height="150" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <circle cx="102" cy="414" r="15" fill="#364157"/><text x="102" y="419" class="step white" text-anchor="middle">5</text>
  <text x="128" y="420" class="card-title">물리 USB Galaxy 등록</text>
  <text x="98" y="453" class="body">adb 목록에서 실제 usb: transport 확인</text>
  <text x="98" y="479" class="body">목록 serial = ro.serialno · model 확인</text>
  <text x="98" y="505" class="small">원격 ADB · emulator · 여러 tunnel 후보는 거절</text>
  <path d="M462 459 H510" class="line" marker-end="url(#arrow)"/>

  <rect x="512" y="384" width="374" height="150" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <circle cx="542" cy="414" r="15" fill="#364157"/><text x="542" y="419" class="step white" text-anchor="middle">6</text>
  <text x="568" y="420" class="card-title">private profile 저장</text>
  <text x="538" y="453" class="body">physical serial · model · Tailscale IPv4</text>
  <text x="538" y="479" class="body">OpenMinis port · 고정 ADB 선호</text>
  <text x="538" y="505" class="small">디렉터리 0700 · 파일 0600 · 공개 금지</text>
  <path d="M886 459 H934" class="line" marker-end="url(#arrow)"/>

  <rect x="936" y="384" width="384" height="150" rx="8" fill="#f1faf6" stroke="#197052" stroke-width="1.8"/>
  <circle cx="966" cy="414" r="15" fill="#197052"/><text x="966" y="419" class="step white" text-anchor="middle">7</text>
  <text x="992" y="420" class="card-title">기본 등록 검증</text>
  <text x="962" y="453" class="body">setup verify · galaxy doctor all</text>
  <text x="962" y="479" class="body">등록 신원과 준비된 경로 확인</text>
  <text x="962" y="505" class="small">READY는 아직 실기기 E2E 성공을 뜻하지 않음</text>

  <path d="M1128 534 V576" class="green-line" marker-end="url(#arrow-green)"/>
  <text x="72" y="574" class="section">ONLY WHEN NEEDED</text>

  <rect x="72" y="594" width="382" height="130" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="98" y="625" class="step blue">조건 A · OpenMinis network_error</text>
  <text x="98" y="655" class="card-title">개인화 Control v2 브리지</text>
  <text x="98" y="682" class="body">전용 handoff 생성 → Minis 대화에 1회 적용</text>
  <text x="98" y="705" class="small">앱/APK 자동 설치·업데이트는 하지 않음</text>

  <rect x="486" y="594" width="382" height="130" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="512" y="625" class="step blue">조건 B · 원격 scrcpy/ADB 필요</text>
  <text x="512" y="655" class="card-title">공식 Wireless Debugging</text>
  <text x="512" y="682" class="body">pairing port와 connection port 구분</text>
  <text x="512" y="705" class="small">6자리 코드는 사용자만 stdin에 직접 입력</text>

  <rect x="900" y="594" width="420" height="130" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="926" y="625" class="step blue">재연결 전</text>
  <text x="926" y="655" class="card-title">원격 transport 신원 재검증</text>
  <text x="926" y="682" class="body">등록 physical serial · model을 실시간 비교</text>
  <text x="926" y="705" class="small">고정 profile과 다르면 연결 중단</text>

  <path d="M263 724 V758 H696" class="line"/>
  <path d="M677 724 V758" class="line"/>
  <path d="M1110 724 V758 H696" class="line"/>
  <path d="M696 758 V782" class="green-line" marker-end="url(#arrow-green)"/>

  <rect x="286" y="784" width="820" height="88" rx="8" fill="#f1faf6" stroke="#197052" stroke-width="2"/>
  <text x="696" y="816" class="card-title green" text-anchor="middle">실기기 완료 검증</text>
  <text x="696" y="844" class="body" text-anchor="middle">저위험 화면 관찰 → 최소 입력 → 새 상태 확인 → 가능한 경우 다른 경로로 교차 검증</text>
  <text x="696" y="864" class="small" text-anchor="middle">이 검증까지 통과해야 Galaxy Control 사용 준비 완료</text>

  <rect x="38" y="928" width="1324" height="34" fill="#f0f1f4"/>
  <rect x="38" y="928" width="5" height="34" fill="#e9582c"/>
  <text x="60" y="950" class="small">실제 serial · IP · token · pairing code는 그림과 공개 저장소에 포함하지 않습니다.</text>
</svg>
