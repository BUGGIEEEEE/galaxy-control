<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Codex와 Galaxy의 선택적 사전검사, 최소 조작, 결과 검증 흐름</title>
  <desc id="desc">사용자 요청을 작업 유형으로 분류하고 OpenMinis, ADB, scrcpy 중 필요한 경로만 검사한 뒤 최소 조작하고 실제 경로 정보와 새로운 상태로 결과를 검증하는 구조</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #293044; }
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #536078; }
      .title { font-size: 48px; font-weight: 760; letter-spacing: -2px; }
      .subtitle { font-size: 17px; font-weight: 550; fill: #536078; }
      .section { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #6a7488; }
      .card-title { font-size: 20px; font-weight: 760; }
      .body { font-size: 15px; font-weight: 520; fill: #4f5a70; }
      .small { font-size: 13px; font-weight: 540; fill: #617087; }
      .pill { font-size: 12px; font-weight: 750; }
      .step { font-size: 14px; font-weight: 760; }
      .white { fill: #fff !important; }
      .orange { fill: #e9582c; }
      .blue { fill: #2859bd; }
      .green { fill: #197052; }
      .line { fill: none; stroke: #364157; stroke-width: 2; }
      .blue-line { fill: none; stroke: #2859bd; stroke-width: 2.2; }
      .green-line { fill: none; stroke: #197052; stroke-width: 2.2; }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#364157"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2859bd"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#197052"/>
    </marker>
  </defs>

  <rect width="1400" height="920" fill="#fbfcfe"/>
  <rect x="1" y="1" width="1398" height="918" fill="none" stroke="#c7cfdb"/>

  <text x="42" y="46" class="eyebrow">01 / OPERATING ARCHITECTURE · v0.4.0</text>
  <text x="42" y="98" class="title">Codex ↔ Galaxy 연동 구조</text>
  <text x="900" y="52" class="subtitle">작업 형태를 먼저 판단하고 필요한 경로만 확인합니다.</text>
  <text x="900" y="80" class="subtitle">조작 뒤에는 새 상태를 읽어 성공 여부를 검증합니다.</text>

  <rect x="38" y="132" width="1324" height="730" rx="2" fill="#f5f7fa" stroke="#c7cfdb"/>

  <text x="72" y="166" class="section">REQUEST &amp; CLASSIFY</text>
  <rect x="72" y="186" width="250" height="106" rx="7" fill="#fff8f4" stroke="#ef6436" stroke-width="2"/>
  <rect x="92" y="203" width="48" height="24" rx="12" fill="#ef6436"/>
  <text x="116" y="220" class="pill white" text-anchor="middle">요청</text>
  <text x="197" y="252" class="card-title" text-anchor="middle">사용자 요청</text>
  <text x="197" y="278" class="body" text-anchor="middle">“Galaxy에서 이 작업 해줘”</text>

  <path d="M322 239 H372" class="line" marker-end="url(#arrow)"/>

  <rect x="374" y="186" width="344" height="106" rx="7" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <rect x="394" y="203" width="76" height="24" rx="12" fill="#364157"/>
  <text x="432" y="220" class="pill white" text-anchor="middle">분류</text>
  <text x="546" y="251" class="card-title" text-anchor="middle">작업 유형 먼저 판단</text>
  <text x="546" y="278" class="body" text-anchor="middle">의미·버튼 / 시스템 사실 / 실시간 제스처</text>

  <path d="M718 239 H768" class="line" marker-end="url(#arrow)"/>

  <rect x="770" y="186" width="550" height="106" rx="7" fill="#eef5ff" stroke="#2859bd" stroke-width="1.8"/>
  <text x="800" y="221" class="step blue">선택적 사전검사</text>
  <text x="800" y="251" class="body">관련된 경로만 검사 · 성공 결과는 현재 에이전트 세션에서만 재사용</text>
  <text x="800" y="278" class="small">재부팅 · 네트워크 변경 · bridge/ADB 오류 · 프로세스 종료 시 즉시 무효화</text>

  <text x="72" y="340" class="section">ONLY THE REQUIRED PATH</text>

  <rect x="72" y="360" width="382" height="176" rx="8" fill="#f4f7ff" stroke="#2859bd" stroke-width="1.8"/>
  <circle cx="104" cy="394" r="16" fill="#2859bd"/>
  <text x="104" y="399" class="step white" text-anchor="middle">1</text>
  <text x="132" y="400" class="card-title">OPENMINIS</text>
  <text x="98" y="434" class="body">글자 · 역할 · 버튼 · UI 상태</text>
  <text x="98" y="462" class="body">의미 기반 탭 · 입력 · 키 · 스크롤</text>
  <rect x="98" y="486" width="244" height="28" rx="14" fill="#e7edff"/>
  <text x="220" y="505" class="pill blue" text-anchor="middle">openminis만 health + a11y 검사</text>

  <rect x="486" y="360" width="382" height="176" rx="8" fill="#f4f7ff" stroke="#2859bd" stroke-width="1.8"/>
  <circle cx="518" cy="394" r="16" fill="#2859bd"/>
  <text x="518" y="399" class="step white" text-anchor="middle">2</text>
  <text x="546" y="400" class="card-title">ADB / SHIZUKU</text>
  <text x="512" y="434" class="body">기기 신원 · 패키지 · 프로세스 · 시스템 사실</text>
  <text x="512" y="462" class="body">고정된 읽기·복구 프로필만 사용</text>
  <rect x="512" y="486" width="218" height="28" rx="14" fill="#e7edff"/>
  <text x="621" y="505" class="pill blue" text-anchor="middle">adb만 연결 + 신원 검사</text>

  <rect x="900" y="360" width="420" height="176" rx="8" fill="#f4f7ff" stroke="#2859bd" stroke-width="1.8"/>
  <circle cx="932" cy="394" r="16" fill="#2859bd"/>
  <text x="932" y="399" class="step white" text-anchor="middle">3</text>
  <text x="960" y="400" class="card-title">SCRCPY</text>
  <text x="926" y="434" class="body">실시간 화면 · 드래그 · 회전 · 복합 제스처</text>
  <text x="926" y="462" class="body">관리되는 창 · 고정된 기기 프로필</text>
  <rect x="926" y="486" width="272" height="28" rx="14" fill="#e7edff"/>
  <text x="1062" y="505" class="pill blue" text-anchor="middle">ADB 신원 확인 → scrcpy 검사</text>

  <path d="M263 536 V570 H696" class="blue-line"/>
  <path d="M677 536 V570" class="blue-line"/>
  <path d="M1110 536 V570 H696" class="blue-line"/>
  <path d="M696 570 V604" class="blue-line" marker-end="url(#arrow-blue)"/>

  <rect x="456" y="606" width="480" height="88" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <text x="696" y="640" class="card-title" text-anchor="middle">최소 조작 1회</text>
  <text x="696" y="669" class="body" text-anchor="middle">애매하면 반복하지 않고 관찰을 추가합니다</text>

  <path d="M936 650 H1000" class="line" marker-end="url(#arrow)"/>
  <rect x="1002" y="606" width="318" height="88" rx="8" fill="#fff" stroke="#364157" stroke-width="1.8"/>
  <text x="1028" y="637" class="step">실행 경로 증거 · result.route</text>
  <text x="1028" y="665" class="small">controller · transport · role</text>
  <text x="1028" y="684" class="small">verification_required · verify_with</text>

  <path d="M696 694 V730" class="green-line" marker-end="url(#arrow-green)"/>
  <rect x="72" y="732" width="1248" height="96" rx="8" fill="#f1faf6" stroke="#197052" stroke-width="2"/>
  <text x="98" y="766" class="step green">새로운 상태로 결과 검증</text>
  <text x="98" y="795" class="card-title">명령 성공이나 창 생성으로 끝내지 않고 목적 상태를 다시 읽습니다</text>
  <text x="98" y="818" class="small">가능하면 다른 경로로 독립 검증 · 독립 경로가 없으면 같은 경로에서 새 목적 상태 확인</text>

  <path d="M72 780 H50 V164 H72" class="green-line dash"/>
  <text x="1160" y="850" class="small green">검증된 경우에만 다음 조작</text>

  <rect x="42" y="884" width="18" height="12" fill="#fff8f4" stroke="#ef6436"/>
  <text x="70" y="895" class="small">사용자 요청</text>
  <rect x="185" y="884" width="18" height="12" fill="#f4f7ff" stroke="#2859bd"/>
  <text x="213" y="895" class="small">Codex 선택·실행</text>
  <rect x="346" y="884" width="18" height="12" fill="#f1faf6" stroke="#197052"/>
  <text x="374" y="895" class="small">새 상태 검증</text>
</svg>
