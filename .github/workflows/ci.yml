name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==0.11.5"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check --silent .
      - name: Type check
        run: uv run basedpyright && uv run basedpyright --project bridge-pyrightconfig.json
      - name: Compile
        run: python -m compileall -q skill/galaxy-control/scripts skill/galaxy-control/assets/openminis-control-v2 scripts
      - name: Privacy scan
        run: python scripts/privacy_scan.py --history
