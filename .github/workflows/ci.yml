name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==0.11.5"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check --ignore-noqa . && uv run ruff format --check --silent .
      - name: Type check
        run: uv run basedpyright
      - name: Compile
        run: python -m compileall -q skill/galaxy-control/scripts scripts
      - name: Privacy scan
        run: python scripts/privacy_scan.py --history
